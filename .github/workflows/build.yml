name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          unzip -q BoxClaimer_project_v3.zip -d .
          find . -name "buildozer.spec" -o -name "buildozer.spec.txt"

      - name: Locate project
        run: |
          SPEC=$(find . -name "buildozer.spec" | head -1)
          if [ -z "$SPEC" ]; then
            echo "buildozer.spec NOT FOUND"
            exit 1
          fi
          DIR=$(dirname "$SPEC")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev build-essential ccache
          pip install --upgrade pip cython==0.29.36 virtualenv buildozer

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: buildozer -v android debug
